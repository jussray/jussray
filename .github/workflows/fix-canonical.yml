name: One-time Juss & Co canonical repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-canonical.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Replace only the stale canonical URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          old = '<link rel="canonical" href="https://jussray.github.io/jussray/">'
          new = '<link rel="canonical" href="https://jussco.company/">'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale canonical, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Prove one-line semantic diff
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<link rel="canonical" href="https://jussco.company/">' site/index.html
          ! grep -Fq 'https://jussray.github.io/jussray/' site/index.html
          test "$(git diff --numstat -- site/index.html)" = $'1\t1\tsite/index.html'
          git diff --check
          git diff -- site/index.html

      - name: Commit canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add site/index.html
          git commit -m 'fix(seo): point homepage canonical at jussco.company'
          git push origin HEAD:main
