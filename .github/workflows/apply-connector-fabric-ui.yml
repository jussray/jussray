name: One-time connector fabric UI expansion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-connector-fabric-ui.yml']
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded connector fabric UI patch
        run: node scripts/apply-connector-fabric-ui.mjs
      - name: Prove bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'data/connectors.json' site/index.html
          grep -Fq 'no connector claims connected without runtime proof' scripts/verify-site.mjs
          grep -Fq 'connector fabric registry valid' .github/workflows/site-proof.yml
          git diff -- site/index.html scripts/verify-site.mjs .github/workflows/site-proof.yml
      - name: Commit connector fabric UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add site/index.html scripts/verify-site.mjs .github/workflows/site-proof.yml
          git commit -m 'feat(site): render connector fabric with truthful states'
          git push origin HEAD:main
