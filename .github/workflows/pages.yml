name: Deploy Juss & Co site and founder pages to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: founder-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify checked-out identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'verified_sha=%s\n' "$EXPECTED_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage Juss & Co site (root) and founder pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/profile _site/digital _site/picks
          cp -R site/. _site/
          cp docs/profile/index.html _site/profile/index.html
          cp docs/index.html _site/digital/index.html
          cp docs/picks/index.html _site/picks/index.html
          touch _site/.nojekyll
          find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
