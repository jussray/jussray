name: Juss & Co independent provider site proof
on:
  pull_request:
    paths:
      - scripts/verify-provider-site.mjs
      - scripts/verify-provider-site.test.mjs
      - .github/workflows/provider-site-proof.yml
  workflow_dispatch:
    inputs:
      proof_scope:
        description: "Choose full multi-destination proof or public canonical domains only"
        required: true
        default: full
        type: choice
        options: [full, canonical_domains]
permissions:
  contents: read
concurrency:
  group: provider-site-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test independent provider proof guards (offline)
        run: node --test scripts/verify-provider-site.test.mjs
      # Only a manually dispatched run on main may attest to the public
      # deployment. Pull request jobs test source guards, not production.
      - name: Reject production dispatch outside main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production proof requires workflow_dispatch on main; refusing non-main dispatch."
          exit 1
      - name: Verify public production via Cloudflare Browser Rendering
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.proof_scope == 'full' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RENDERING_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RENDERING_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-provider-site.mjs
      - name: Verify canonical domains and Games without weakening Cloudflare Bot Fight Mode
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.proof_scope == 'canonical_domains' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RENDERING_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RENDERING_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-provider-site.mjs --canonical-only
      - name: Upload immutable per-commit production receipt
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-site-proof-${{ github.sha }}
          path: |
            proof/site/provider-${{ github.sha }}.json
            proof/site/canonical-provider-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
