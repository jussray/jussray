name: Juss & Co independent provider site proof
on:
  # Proof after deployment; pre-deploy production checks would compare against the old live build.
  workflow_run:
    workflows: ['Juss & Co Cloudflare release']
    types: [completed]
  pull_request:
    paths:
      - scripts/verify-provider-site.mjs
      - scripts/verify-provider-site.test.mjs
      - .github/workflows/provider-site-proof.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-site-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test independent provider proof guards (offline)
        run: node --test scripts/verify-provider-site.test.mjs
      # Successful exact-head deployment or explicit main dispatch may attest to the public
      # deployment. Pull request jobs test source guards, not production.
      - name: Reject production jobs outside main
        if: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production proof requires workflow_dispatch on main; refusing non-main dispatch."
          exit 1
      - name: Verify public production via Cloudflare Browser Rendering
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RENDERING_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RENDERING_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/verify-provider-site.mjs
      - name: Upload immutable per-commit production receipt
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-site-proof-${{ github.event.workflow_run.head_sha || github.sha }}
          path: proof/site/provider-${{ github.event.workflow_run.head_sha || github.sha }}.json
          if-no-files-found: warn
          retention-days: 30
