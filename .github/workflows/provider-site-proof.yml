name: Juss & Co provider public readback (partial)
on:
  pull_request:
    paths:
      - scripts/verify-provider-site.mjs
      - scripts/verify-provider-site.test.mjs
      - .github/workflows/provider-site-proof.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-site-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test independent provider proof guards (offline)
        run: node --test scripts/verify-provider-site.test.mjs
      # Main-only dispatch validates public readback, NOT full release or deployed-SHA attestation.
      # PR jobs test only source guards.
      - name: Reject production dispatch outside main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production proof requires workflow_dispatch on main; refusing non-main dispatch."
          exit 1
      - name: Witness public readback (partial; not release verification)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RENDERING_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RENDERING_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-provider-site.mjs
      - name: Upload partial readback receipt (not deployment attestation)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partial-provider-readback-${{ github.sha }}
          path: proof/site/provider-${{ github.sha }}.json
          if-no-files-found: warn
          retention-days: 30
