name: One-time portfolio discoverability patch

on:
  push:
    branches: [feat/public-portfolio-projection-v1]
    paths:
      - '.github/workflows/patch-homepage-portfolio-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/public-portfolio-projection-v1
          fetch-depth: 0

      - name: Patch only portfolio discovery copy and navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          replacements = [
              (
                  '<meta property="og:description" content="A founder studio for a brighter tomorrow. Six worlds, one proof protocol.">',
                  '<meta property="og:description" content="A founder studio for a brighter tomorrow. Featured worlds, a complete portfolio map, and one proof protocol.">'
              ),
              (
                  '      <a href="#worlds" data-nav="worlds">Worlds</a>\n      <a href="#proof" data-nav="proof">Proof</a>',
                  '      <a href="#worlds" data-nav="worlds">Worlds</a>\n      <a href="portfolio.html">Portfolio</a>\n      <a href="#proof" data-nav="proof">Proof</a>'
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old[:60]!r}; found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-homepage-portfolio-link.yml

      - name: Prove bounded patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'href="portfolio.html">Portfolio</a>' site/index.html
          grep -Fq 'Featured worlds, a complete portfolio map, and one proof protocol.' site/index.html
          ! grep -Fq 'Six worlds, one proof protocol.' site/index.html
          test -f site/portfolio.html
          git diff --check
          git diff -- site/index.html

      - name: Commit bounded homepage patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add site/index.html .github/workflows/patch-homepage-portfolio-link.yml
          git commit -m 'feat(site): make complete portfolio discoverable'
          git push origin HEAD:feat/public-portfolio-projection-v1
