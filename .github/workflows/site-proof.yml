name: Juss & Co site browser proof
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/verify-site.mjs', 'wrangler.jsonc', '.github/workflows/site-proof.yml']
  pull_request:
    paths: ['site/**', 'scripts/verify-site.mjs', 'wrangler.jsonc', '.github/workflows/site-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm i --no-save --no-audit --no-fund playwright@1.61.1 && npx playwright install chromium --with-deps
      - run: node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); const routes=c.routes||[]; const expected=['jussco.company','www.jussco.company']; const actual=routes.filter(r=>r?.custom_domain===true).map(r=>r.pattern).sort(); if(c.name!=='jussray'||c.assets?.directory!=='./site'||JSON.stringify(actual)!==JSON.stringify(expected)) process.exit(1); console.log('wrangler deploy target + custom domains valid')"
      - name: Validate world registry
        run: node -e "const d=JSON.parse(require('fs').readFileSync('site/data/worlds.json','utf8')); const worlds=d.worlds||[]; const names=worlds.map(x=>x.name); const required=['Se\'kret Bip','Founder Control Room','Chief AI','Juss Beautiful Hair','StoryEngine','Sync Party','Bip Jr','PromptOS','SolContinuity','Untold Stories','SWEATS','SleepWealth Agent','Solwealth','Think Tank','Alexa Commerce Engine','Ayure']; if(d.registryVersion<3||new Set(names).size!==names.length||!required.every(x=>names.includes(x))) process.exit(1); console.log(names.length+'-world portfolio registry valid')"
      - name: Validate standalone OS registry
        run: node -e "const d=JSON.parse(require('fs').readFileSync('site/data/systems.json','utf8')); const pub=(d.systems||[]).filter(x=>x.public!==false); const names=pub.map(x=>x.name); const expected=['Truth Weaver','Truth Compass','Exact Match Engine','Living Truth','Proof Core']; const internal=(d.systems||[]).filter(x=>x.public===false); if(JSON.stringify(names)!==JSON.stringify(expected)||!pub.every(x=>x.kind==='standalone_os')||!pub.every(x=>Array.isArray(x.embeddedIn)&&x.embeddedIn.length)||internal.length<2||!d.rules?.embeddedDoesNotMeanComponentOnly) process.exit(1); console.log('standalone OS registry + embedded relationships valid')"
      - name: Validate connector fabric registry
        run: node -e "const d=JSON.parse(require('fs').readFileSync('site/data/connectors.json','utf8')); const ids=(d.lanes||[]).map(x=>x.id); const expected=['exa','notion','linear','slack']; const systems=d.systems||{}; const publicSystems=['Truth Weaver','Truth Compass','Exact Match Engine','Living Truth','Proof Core']; const bindings=Object.values(systems).flatMap(x=>x.bindings||[]); if(JSON.stringify(ids)!==JSON.stringify(expected)||!publicSystems.every(n=>Array.isArray(systems[n]?.bindings)&&systems[n].bindings.length===4)||bindings.some(x=>x.state==='connected')) process.exit(1); console.log('connector fabric registry valid; no unproven connected state')"
      - name: Verify canonical public URL
        run: node -e "const s=require('fs').readFileSync('site/index.html','utf8'); const good='<link rel=\"canonical\" href=\"https://jussco.company/\">'; const stale='https://jussray.github.io/jussray/'; if(!s.includes(good)||s.includes(stale)) process.exit(1); console.log('canonical Juss & Co URL valid')"
      - run: node scripts/verify-site.mjs
      - name: Verify public custom domains
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 18); do
            ok=1
            echo "public-domain attempt ${attempt}/18"
            for host in jussco.company www.jussco.company; do
              body="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/" 2>/tmp/jussco-curl.err)" || {
                echo "${host}: unreachable"
                cat /tmp/jussco-curl.err || true
                ok=0
                continue
              }
              systems="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/data/systems.json" 2>/tmp/jussco-systems-curl.err)" || {
                echo "${host}: systems registry unreachable"
                cat /tmp/jussco-systems-curl.err || true
                ok=0
                continue
              }
              connectors="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/data/connectors.json" 2>/tmp/jussco-connectors-curl.err)" || {
                echo "${host}: connector registry unreachable"
                cat /tmp/jussco-connectors-curl.err || true
                ok=0
                continue
              }
              worlds="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/data/worlds.json" 2>/tmp/jussco-worlds-curl.err)" || {
                echo "${host}: worlds registry unreachable"
                cat /tmp/jussco-worlds-curl.err || true
                ok=0
                continue
              }
              services="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/services.html" 2>/tmp/jussco-services-curl.err)" || {
                echo "${host}: services page unreachable"
                cat /tmp/jussco-services-curl.err || true
                ok=0
                continue
              }
              if grep -Fq 'Turn thoughts into living works.' <<<"${body}" && grep -Fq 'Built to stand alone.' <<<"${body}"; then
                echo "${host}: canonical hero + standalone OS section verified"
              else
                echo "${host}: reachable but canonical site/OS fingerprints missing"
                ok=0
              fi
              if grep -Fq 'Work with Juss' <<<"${services}" && grep -Fq '$49' <<<"${services}" && grep -Fq '$149' <<<"${services}" && grep -Fq '$399' <<<"${services}" && ! grep -Eq 'Sajay|Juss Digital' <<<"${services}"; then
                echo "${host}: Juss services page verified"
              else
                echo "${host}: services page missing current identity or offer fingerprints"
                ok=0
              fi
              for expected in 'Truth Weaver' 'Truth Compass' 'Exact Match Engine' 'Living Truth' 'Proof Core'; do
                if ! grep -Fq "${expected}" <<<"${systems}"; then
                  echo "${host}: systems registry missing ${expected}"
                  ok=0
                fi
              done
              for expected in 'Exa' 'Notion' 'Linear' 'Slack'; do
                if ! grep -Fq "${expected}" <<<"${connectors}"; then
                  echo "${host}: connector registry missing ${expected}"
                  ok=0
                fi
              done
              if grep -Fq '"state": "connected"' <<<"${connectors}"; then
                echo "${host}: connector registry contains unproven connected claim"
                ok=0
              fi
              for expected in 'Bip Jr' 'PromptOS' 'SolContinuity' 'Untold Stories' 'SWEATS' 'SleepWealth Agent' 'Solwealth' 'Think Tank' 'Alexa Commerce Engine' 'Ayure'; do
                if ! grep -Fq "${expected}" <<<"${worlds}"; then
                  echo "${host}: worlds registry missing ${expected}"
                  ok=0
                fi
              done
            done
            if [ "${ok}" -eq 1 ]; then
              echo "canonical domains + full portfolio + connector registries are live"
              exit 0
            fi
            sleep 10
          done
          echo "canonical domains did not become healthy within the verification window"
          exit 1
      - name: Verify deployed portfolio in real browsers
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readFileSync } from 'node:fs';
          const browser = await chromium.launch();
          const worldRegistry = JSON.parse(readFileSync('site/data/worlds.json','utf8'));
          const requiredWorlds = worldRegistry.worlds.map(w => w.name);
          const requiredSystems = ['Truth Weaver','Truth Compass','Exact Match Engine','Living Truth','Proof Core'];
          const requiredConnectors = ['Exa','Notion','Linear','Slack'];
          let failed = false;
          for (const host of ['jussco.company','www.jussco.company']) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto(`https://${host}/`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction((expectedCount) => document.querySelectorAll('.card').length === expectedCount && document.querySelectorAll('.os-card').length === 5 && document.querySelectorAll('.os-connectors').length === 5, requiredWorlds.length, { timeout: 20000 });
            const worldNames = await page.locator('.card h3').allTextContents();
            const systemNames = await page.locator('.os-card h3').allTextContents();
            const connectorText = (await page.locator('#systems').innerText()).toLowerCase();
            const connectedClaims = await page.locator('.os-connectors span[data-state="connected"]').count();
            const blockedClaims = await page.locator('.os-connectors span[data-state="blocked"]').count();
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            const ok = requiredWorlds.every(n => worldNames.includes(n)) && requiredSystems.every(n => systemNames.includes(n)) && requiredConnectors.every(n => connectorText.includes(n.toLowerCase())) && connectedClaims === 0 && blockedClaims >= 4 && !worldNames.some(n => n.startsWith('ULTRATHINK')) && overflow === 0 && errors.length === 0;
            console.log(`${host}: ${worldNames.length} worlds + ${systemNames.length} standalone systems + ${requiredConnectors.length} connector lanes; deployed-browser ${ok ? 'verified' : 'FAILED'}`);
            if (!ok) failed = true;

            await page.goto(`https://${host}/services.html`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            const serviceText = await page.locator('body').innerText();
            const serviceOverflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            const serviceOk = (await page.title()) === 'Work with Juss — Focused fixes, verified outcomes.'
              && ['Work with Juss','$49','$149','$399'].every(x => serviceText.includes(x))
              && !/Sajay|Juss Digital/.test(serviceText)
              && (await page.locator('a[href^="mailto:hello@jussbeautifulhair.com"]').count()) === 4
              && (await page.locator('a[href*="linkedin.com/in/juss-rayy"]').count()) === 1
              && /not proof that payment was collected/i.test(serviceText)
              && serviceOverflow === 0
              && errors.length === 0;
            console.log(`${host}: services deployed-browser ${serviceOk ? 'verified' : 'FAILED'}`);
            if (!serviceOk) failed = true;
            await page.close();
          }
          await browser.close();
          if (failed) process.exit(1);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: site-proof-${{ github.sha }}
          path: proof/site/
          retention-days: 30
