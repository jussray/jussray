name: Juss & Co site browser proof
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/verify-site.mjs', 'wrangler.jsonc', '.github/workflows/site-proof.yml']
  pull_request:
    paths: ['site/**', 'scripts/verify-site.mjs', 'wrangler.jsonc', '.github/workflows/site-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm i --no-save --no-audit --no-fund playwright@1.61.1 && npx playwright install chromium --with-deps
      - run: node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); const routes=c.routes||[]; const expected=['jussco.company','www.jussco.company']; const actual=routes.filter(r=>r?.custom_domain===true).map(r=>r.pattern).sort(); if(c.name!=='jussray'||c.assets?.directory!=='./site'||JSON.stringify(actual)!==JSON.stringify(expected)) process.exit(1); console.log('wrangler deploy target + custom domains valid')"
      - run: node -e "JSON.parse(require('fs').readFileSync('site/data/worlds.json','utf8')); console.log('worlds.json valid')"
      - name: Validate standalone OS registry
        run: node -e "const d=JSON.parse(require('fs').readFileSync('site/data/systems.json','utf8')); const pub=(d.systems||[]).filter(x=>x.public!==false); const names=pub.map(x=>x.name); const expected=['Truth Weaver','Truth Compass','Exact Match Engine','Living Truth','Proof Core']; const internal=(d.systems||[]).filter(x=>x.public===false); if(JSON.stringify(names)!==JSON.stringify(expected)||!pub.every(x=>x.kind==='standalone_os')||!pub.every(x=>Array.isArray(x.embeddedIn)&&x.embeddedIn.length)||internal.length<2||!d.rules?.embeddedDoesNotMeanComponentOnly) process.exit(1); console.log('standalone OS registry + embedded relationships valid')"
      - name: Verify canonical public URL
        run: node -e "const s=require('fs').readFileSync('site/index.html','utf8'); const good='<link rel=\"canonical\" href=\"https://jussco.company/\">'; const stale='https://jussray.github.io/jussray/'; if(!s.includes(good)||s.includes(stale)) process.exit(1); console.log('canonical Juss & Co URL valid')"
      - run: node scripts/verify-site.mjs
      - name: Verify public custom domains
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 18); do
            ok=1
            echo "public-domain attempt ${attempt}/18"
            for host in jussco.company www.jussco.company; do
              body="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/" 2>/tmp/jussco-curl.err)" || {
                echo "${host}: unreachable"
                cat /tmp/jussco-curl.err || true
                ok=0
                continue
              }
              if grep -Fq 'Turn thoughts into living works.' <<<"${body}"; then
                echo "${host}: canonical Juss & Co content verified"
              else
                echo "${host}: reachable but canonical hero fingerprint missing"
                ok=0
              fi
            done
            if [ "${ok}" -eq 1 ]; then
              echo "canonical domains are live"
              exit 0
            fi
            sleep 10
          done
          echo "canonical domains did not become healthy within the verification window"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-proof-${{ github.sha }}
          path: proof/site/
          retention-days: 30
