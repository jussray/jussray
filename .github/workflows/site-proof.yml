name: Juss & Co site browser proof
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/verify-site.mjs', 'wrangler.jsonc', '.github/workflows/site-proof.yml']
  pull_request:
    paths: ['site/**', 'scripts/verify-site.mjs', 'wrangler.jsonc', '.github/workflows/site-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm i --no-save --no-audit --no-fund playwright@1.61.1 && npx playwright install chromium --with-deps
      - run: node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.name!=='jussray'||c.assets?.directory!=='./site') process.exit(1); console.log('wrangler deploy target valid')"
      - run: node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); const want=['jussco.company','www.jussco.company']; const got=(c.routes||[]).map(r=>r.custom_domain===true?r.pattern:'NOT_CUSTOM:'+r.pattern).sort(); if(JSON.stringify(got)!==JSON.stringify(want)){console.error('wrangler routes must be exactly',want,'as custom domains; got',got);process.exit(1)} console.log('wrangler domains valid',got)"
      - run: node -e "JSON.parse(require('fs').readFileSync('site/data/worlds.json','utf8')); console.log('worlds.json valid')"
      - run: node scripts/verify-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-proof-${{ github.sha }}
          path: proof/site/
          retention-days: 30
