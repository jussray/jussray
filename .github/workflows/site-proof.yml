name: Juss & Co site browser proof
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/verify-site.mjs', 'wrangler.jsonc', '.github/workflows/site-proof.yml']
  pull_request:
    paths: ['site/**', 'scripts/verify-site.mjs', 'wrangler.jsonc', '.github/workflows/site-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm i --no-save --no-audit --no-fund playwright@1.61.1 && npx playwright install chromium --with-deps
      - run: node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); const routes=c.routes||[]; const expected=['jussco.company','www.jussco.company']; const actual=routes.filter(r=>r?.custom_domain===true).map(r=>r.pattern).sort(); if(c.name!=='jussray'||c.assets?.directory!=='./site'||JSON.stringify(actual)!==JSON.stringify(expected)) process.exit(1); console.log('wrangler deploy target + custom domains valid')"
      - name: Validate world registry
        run: node -e "const d=JSON.parse(require('fs').readFileSync('site/data/worlds.json','utf8')); const names=(d.worlds||[]).map(x=>x.name); const added=['Bip Jr','PromptOS','SolContinuity','Untold Stories','SWEATS','SleepWealth Agent','Think Tank','Alexa Commerce Engine','Ayure']; if(names.length!==15||!added.every(x=>names.includes(x))) process.exit(1); console.log('15-world portfolio registry valid')"
      - name: Validate standalone OS registry
        run: node -e "const d=JSON.parse(require('fs').readFileSync('site/data/systems.json','utf8')); const pub=(d.systems||[]).filter(x=>x.public!==false); const names=pub.map(x=>x.name); const expected=['Truth Weaver','Truth Compass','Exact Match Engine','Living Truth','Proof Core']; const internal=(d.systems||[]).filter(x=>x.public===false); if(JSON.stringify(names)!==JSON.stringify(expected)||!pub.every(x=>x.kind==='standalone_os')||!pub.every(x=>Array.isArray(x.embeddedIn)&&x.embeddedIn.length)||internal.length<2||!d.rules?.embeddedDoesNotMeanComponentOnly) process.exit(1); console.log('standalone OS registry + embedded relationships valid')"
      - name: Verify canonical public URL
        run: node -e "const s=require('fs').readFileSync('site/index.html','utf8'); const good='<link rel=\"canonical\" href=\"https://jussco.company/\">'; const stale='https://jussray.github.io/jussray/'; if(!s.includes(good)||s.includes(stale)) process.exit(1); console.log('canonical Juss & Co URL valid')"
      - run: node scripts/verify-site.mjs
      - name: Verify public custom domains
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 18); do
            ok=1
            echo "public-domain attempt ${attempt}/18"
            for host in jussco.company www.jussco.company; do
              body="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/" 2>/tmp/jussco-curl.err)" || {
                echo "${host}: unreachable"
                cat /tmp/jussco-curl.err || true
                ok=0
                continue
              }
              systems="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/data/systems.json" 2>/tmp/jussco-systems-curl.err)" || {
                echo "${host}: systems registry unreachable"
                cat /tmp/jussco-systems-curl.err || true
                ok=0
                continue
              }
              worlds="$(curl -fsSL --connect-timeout 5 --max-time 15 "https://${host}/data/worlds.json" 2>/tmp/jussco-worlds-curl.err)" || {
                echo "${host}: worlds registry unreachable"
                cat /tmp/jussco-worlds-curl.err || true
                ok=0
                continue
              }
              if grep -Fq 'Turn thoughts into living works.' <<<"${body}" && grep -Fq 'Built to stand alone.' <<<"${body}"; then
                echo "${host}: canonical hero + standalone OS section verified"
              else
                echo "${host}: reachable but canonical site/OS fingerprints missing"
                ok=0
              fi
              for expected in 'Truth Weaver' 'Truth Compass' 'Exact Match Engine' 'Living Truth' 'Proof Core'; do
                if ! grep -Fq "${expected}" <<<"${systems}"; then
                  echo "${host}: systems registry missing ${expected}"
                  ok=0
                fi
              done
              for expected in 'Bip Jr' 'PromptOS' 'SolContinuity' 'Untold Stories' 'SWEATS' 'SleepWealth Agent' 'Think Tank' 'Alexa Commerce Engine' 'Ayure'; do
                if ! grep -Fq "${expected}" <<<"${worlds}"; then
                  echo "${host}: worlds registry missing ${expected}"
                  ok=0
                fi
              done
            done
            if [ "${ok}" -eq 1 ]; then
              echo "canonical domains + full portfolio registries are live"
              exit 0
            fi
            sleep 10
          done
          echo "canonical domains did not become healthy within the verification window"
          exit 1
      - name: Verify deployed portfolio in real browsers
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const requiredWorlds = ['Bip Jr','PromptOS','SolContinuity','Untold Stories','SWEATS','SleepWealth Agent','Think Tank','Alexa Commerce Engine','Ayure'];
          const requiredSystems = ['Truth Weaver','Truth Compass','Exact Match Engine','Living Truth','Proof Core'];
          let failed = false;
          for (const host of ['jussco.company','www.jussco.company']) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto(`https://${host}/`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => document.querySelectorAll('.card').length === 15 && document.querySelectorAll('.os-card').length === 5, null, { timeout: 20000 });
            const worldNames = await page.locator('.card h3').allTextContents();
            const systemNames = await page.locator('.os-card h3').allTextContents();
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            const ok = requiredWorlds.every(n => worldNames.includes(n)) && requiredSystems.every(n => systemNames.includes(n)) && !worldNames.some(n => n.startsWith('ULTRATHINK')) && overflow === 0 && errors.length === 0;
            console.log(`${host}: ${worldNames.length} worlds + ${systemNames.length} standalone systems; deployed-browser ${ok ? 'verified' : 'FAILED'}`);
            if (!ok) failed = true;
            await page.close();
          }
          await browser.close();
          if (failed) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-proof-${{ github.sha }}
          path: proof/site/
          retention-days: 30
