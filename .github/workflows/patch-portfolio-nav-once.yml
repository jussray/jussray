name: One-time portfolio nav reconciliation

on:
  push:
    branches: [feat/public-portfolio-projection-v1]
    paths:
      - '.github/workflows/patch-portfolio-nav-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-portfolio-projection-v1
          fetch-depth: 0
      - name: Reconcile homepage navigation with complete portfolio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text()
          pairs=[
            ('<meta property="og:description" content="A founder studio for a brighter tomorrow. Six worlds, one proof protocol.">','<meta property="og:description" content="A founder studio for a brighter tomorrow. Featured worlds, standalone systems, a complete portfolio map, and one proof protocol.">'),
            ('      <a href="#systems" data-nav="systems">Systems</a>\n      <a href="#proof" data-nav="proof">Proof</a>','      <a href="#systems" data-nav="systems">Systems</a>\n      <a href="portfolio.html">Portfolio</a>\n      <a href="#proof" data-nav="proof">Proof</a>'),
          ]
          for old,new in pairs:
            n=s.count(old)
            if n!=1:
              raise SystemExit(f'expected one match, found {n}: {old[:70]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-portfolio-nav-once.yml
      - name: Verify bounded change
        run: |
          set -euo pipefail
          grep -Fq 'href="portfolio.html">Portfolio</a>' site/index.html
          grep -Fq 'Featured worlds, standalone systems, a complete portfolio map, and one proof protocol.' site/index.html
          grep -Fq 'href="#systems" data-nav="systems">Systems</a>' site/index.html
          test -f site/portfolio.html
          git diff --check
      - name: Commit bounded reconciliation
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add site/index.html .github/workflows/patch-portfolio-nav-once.yml
          git commit -m 'feat(site): reconcile systems and portfolio navigation'
          git push origin HEAD:feat/public-portfolio-projection-v1
