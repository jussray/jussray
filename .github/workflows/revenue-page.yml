name: Revenue page browser proof

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tests/revenue-page.spec.cjs'
      - 'playwright.config.cjs'
      - '.github/workflows/revenue-page.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tests/revenue-page.spec.cjs'
      - 'playwright.config.cjs'
      - '.github/workflows/revenue-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright
        run: npm install --no-save @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local real-browser proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory docs >/tmp/revenue-page-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == '20' ]]; then
              cat /tmp/revenue-page-http.log
              exit 1
            fi
            sleep 1
          done
          npx playwright test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenue-page-playwright-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
