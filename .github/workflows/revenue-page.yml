name: Public site browser proof

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tests/revenue-page.spec.cjs'
      - 'tests/profile-page.spec.cjs'
      - 'playwright.config.cjs'
      - '.github/workflows/revenue-page.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tests/revenue-page.spec.cjs'
      - 'tests/profile-page.spec.cjs'
      - 'playwright.config.cjs'
      - '.github/workflows/revenue-page.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'verified_sha=%s\n' "$actual_sha"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install pinned Playwright
        run: npm install --no-save @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local real-browser proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory docs >/tmp/public-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == '20' ]]; then
              cat /tmp/public-site-http.log
              exit 1
            fi
            sleep 1
          done
          npx playwright test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-site-playwright-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
