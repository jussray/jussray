name: One-shot portfolio site projection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-projection-once.yml'
permissions:
  contents: write
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused projection
        id: apply
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/apply-portfolio-site-projection.py
          python -m json.tool site/data/worlds.json >/dev/null
          python -m json.tool site/data/systems.json >/dev/null
          git diff --check
      - name: Install browser proof dependency
        id: install
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.61.1
          npx playwright install chromium --with-deps
      - name: Run exact-head Playwright proof
        id: proof
        if: steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-site.mjs
      - name: Commit verified projection or clean failed attempt
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'Juss & Co Registry Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.apply.outcome }}' = 'success' ] && [ '${{ steps.install.outcome }}' = 'success' ] && [ '${{ steps.proof.outcome }}' = 'success' ]; then
            git rm -f .github/workflows/portfolio-projection-once.yml scripts/apply-portfolio-site-projection.py
            git add site/index.html site/data/worlds.json site/data/systems.json scripts/verify-site.mjs site/assets/w-truth-compass.png site/assets/w-truth-weaver.png site/assets/w-exact-match.png
            git commit -m 'feat(site): project full canonical portfolio'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            git restore site/index.html site/data/worlds.json site/data/systems.json scripts/verify-site.mjs || true
            rm -f site/assets/w-truth-compass.png site/assets/w-truth-weaver.png site/assets/w-exact-match.png
            git rm -f .github/workflows/portfolio-projection-once.yml scripts/apply-portfolio-site-projection.py
            git commit -m 'chore(site): clean failed portfolio projection'
            git pull --rebase origin main
            git push origin HEAD:main
            exit 1
          fi
