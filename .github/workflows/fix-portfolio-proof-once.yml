name: One-time portfolio proof repair

on:
  push:
    branches: [feat/public-portfolio-projection-v1]
    paths:
      - '.github/workflows/fix-portfolio-proof-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-portfolio-projection-v1
          fetch-depth: 0
      - name: Repair touch targets and rendered-text assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          edits = {
            'site/index.html': [
              (
                '.os-link{align-self:flex-start;color:var(--cyan);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}',
                '.os-link{align-self:flex-start;min-height:40px;display:inline-flex;align-items:center;color:var(--cyan);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}'
              )
            ],
            'site/portfolio.html': [
              (
                '.brand{font-family:var(--serif);font-size:25px;font-weight:800;text-decoration:none}',
                '.brand{min-height:40px;display:inline-flex;align-items:center;font-family:var(--serif);font-size:25px;font-weight:800;text-decoration:none}'
              )
            ],
            'scripts/verify-site.mjs': [
              (
                "say(/20 of 20/.test(await page.innerText('#countLine')), `${vp.n}: portfolio count is data-derived`);",
                "say(((await page.textContent('#countLine')) || '').startsWith('20 of 20'), `${vp.n}: portfolio count is data-derived`);"
              ),
              (
                "say((await sync.locator('.state').innerText()) === 'Live', `${vp.n}: Sync Party remains Live`);",
                "say((await sync.locator('.state').textContent()) === 'Live', `${vp.n}: Sync Party remains Live`);"
              ),
              (
                "say(/10 of 20/.test(await page.innerText('#countLine')), `${vp.n}: filtered count updates`);",
                "say(((await page.textContent('#countLine')) || '').startsWith('10 of 20'), `${vp.n}: filtered count updates`);"
              )
            ]
          }

          for path, replacements in edits.items():
            p = Path(path)
            s = p.read_text()
            for old, new in replacements:
              count = s.count(old)
              if count != 1:
                raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]}')
              s = s.replace(old, new, 1)
            p.write_text(s)

          Path('.github/workflows/fix-portfolio-proof-once.yml').unlink()
          PY
      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.os-link{align-self:flex-start;min-height:40px;display:inline-flex;align-items:center' site/index.html
          grep -Fq '.brand{min-height:40px;display:inline-flex;align-items:center' site/portfolio.html
          grep -Fq "textContent('#countLine')" scripts/verify-site.mjs
          grep -Fq "locator('.state').textContent()" scripts/verify-site.mjs
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add site/index.html site/portfolio.html scripts/verify-site.mjs .github/workflows/fix-portfolio-proof-once.yml
          git commit -m 'fix(site): repair portfolio browser proof failures'
          git push origin HEAD:feat/public-portfolio-projection-v1
