name: One-shot remaining portfolio worlds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-worlds-once.yml'
permissions:
  contents: write
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused world-registry projection
        id: apply
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/apply-portfolio-worlds.py
          python -m json.tool site/data/worlds.json >/dev/null
          python -m json.tool site/data/systems.json >/dev/null
          git diff --check
      - name: Install Playwright
        id: install
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.61.1
          npx playwright install chromium --with-deps
      - name: Run exact-head browser proof
        id: proof
        if: steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-site.mjs
      - name: Publish only if verified
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'Juss & Co Registry Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.apply.outcome }}' = 'success' ] && [ '${{ steps.install.outcome }}' = 'success' ] && [ '${{ steps.proof.outcome }}' = 'success' ]; then
            git rm -f .github/workflows/portfolio-worlds-once.yml scripts/apply-portfolio-worlds.py
            if [ -f .github/workflows/fix-os-link-target.yml ]; then git rm -f .github/workflows/fix-os-link-target.yml; fi
            git add site/index.html site/data/worlds.json site/data/systems.json scripts/verify-site.mjs
            git commit -m 'feat(site): add remaining canonical portfolio worlds'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            git restore site/index.html site/data/worlds.json site/data/systems.json scripts/verify-site.mjs || true
            git rm -f .github/workflows/portfolio-worlds-once.yml scripts/apply-portfolio-worlds.py
            git commit -m 'chore(site): clean failed world-registry projection'
            git pull --rebase origin main
            git push origin HEAD:main
            exit 1
          fi
