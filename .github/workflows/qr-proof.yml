name: JussCo QR scan-ready asset gate
on:
  push:
    branches: [main, feat/scan-jussco-qr-assets-20261019]
    paths: ['site/assets/qr/**','site/data/qr-links.json','site/index.html','scripts/verify-qr.mjs','.github/workflows/qr-proof.yml']
  pull_request:
    paths: ['site/assets/qr/**','site/data/qr-links.json','site/index.html','scripts/verify-qr.mjs','.github/workflows/qr-proof.yml']
permissions:
  contents: read
jobs:
  qr-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-qr.mjs
