name: One-time Juss & Co standalone OS layer expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-os-layer.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add standalone OS layer without altering existing worlds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text()

          def one(old,new,label):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {c}')
              s=s.replace(old,new,1)

          css_anchor='/* ---- proof ---- */'
          css='''/* ---- standalone OS layer ---- */
          .os-layer{background:radial-gradient(65% 70% at 100% 10%,rgba(59,227,255,.10),transparent 60%),radial-gradient(55% 65% at 0% 90%,rgba(184,107,255,.13),transparent 62%),#070720;border-top:1px solid rgba(170,150,255,.14);border-bottom:1px solid rgba(59,227,255,.18)}
          .os-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
          .os-card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(16,14,52,.9),rgba(7,7,28,.96));padding:20px;display:flex;flex-direction:column;gap:12px;min-height:270px;box-shadow:0 18px 46px rgba(0,0,12,.34)}
          .os-card:hover{border-color:rgba(59,227,255,.5);box-shadow:0 22px 52px rgba(0,0,14,.45),0 0 26px rgba(59,227,255,.08)}
          .os-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
          .os-kind{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
          .os-state{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2);border:1px solid rgba(245,193,75,.35);padding:5px 8px;border-radius:999px}
          .os-card h3{font-family:var(--f-serif);font-size:27px;line-height:1;color:#fff;margin:2px 0 0}
          .os-role{color:#D9D4F4;font-size:14px;line-height:1.5;flex:1}
          .os-meta{display:flex;gap:7px;flex-wrap:wrap}
          .os-meta span,.os-embed span{font-family:var(--f-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:6px 8px;border-radius:999px;border:1px solid rgba(170,150,255,.2);color:var(--muted);background:rgba(255,255,255,.02)}
          .os-embed{display:flex;gap:7px;flex-wrap:wrap;padding-top:11px;border-top:1px solid rgba(170,150,255,.13)}
          .os-embed b{width:100%;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
          .os-link{align-self:flex-start;color:var(--cyan);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
          .surface-strip{margin-top:18px;border:1px dashed rgba(184,107,255,.35);border-radius:14px;padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
          .surface-strip b{color:#fff}.os-foot{margin-top:14px;color:var(--dim)}
          @media(max-width:900px){.os-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:640px){.os-grid{grid-template-columns:minmax(0,1fr)}}

          '''
          one(css_anchor,css+css_anchor,'css')

          html_anchor='''<!-- ================= PROOF ================= -->'''
          html='''<!-- ================= STANDALONE OS ================= -->
          <section class="sec os-layer wrap" id="systems" aria-labelledby="h-systems">
            <div class="in">
              <div class="sec-head">
                <div>
                  <div class="kicker mono">Standalone OS layer</div>
                  <h2 class="h2" id="h-systems"><span class="ln">Built to stand alone.</span><span class="ln gold">Built to plug in.</span></h2>
                </div>
                <p class="sec-note"><strong style="color:var(--cream)">Standalone does not mean isolated.</strong> These operating systems are products in their own right and can also be mounted inside Juss &amp; Co systems without giving up their identity or authority boundary.</p>
              </div>
              <div class="os-grid" id="osGrid"></div>
              <div class="surface-strip" id="surfaceStrip" hidden></div>
              <p class="mono os-foot" id="osStamp">Standalone OS registry loading…</p>
            </div>
          </section>

          '''
          one(html_anchor,html+html_anchor,'html')

          nav_old='''      <a href="#worlds" data-nav="worlds">Worlds</a>\n      <a href="#proof" data-nav="proof">Proof</a>'''
          nav_new='''      <a href="#worlds" data-nav="worlds">Worlds</a>\n      <a href="#systems" data-nav="systems">Systems</a>\n      <a href="#proof" data-nav="proof">Proof</a>'''
          one(nav_old,nav_new,'nav')

          js_anchor='''  }).catch(function(){});\n  /* ---------- rotating founder quotes (data-driven, founder-declared) ---------- */'''
          js='''  }).catch(function(){});

          /* ---------- standalone OS registry ---------- */
          var osGrid=document.getElementById("osGrid"), surfaceStrip=document.getElementById("surfaceStrip");
          function renderSystems(d){
            if(!osGrid || !d || !Array.isArray(d.systems)) return;
            osGrid.innerHTML="";
            var visible=d.systems.filter(function(x){ return x.public!==false; });
            visible.forEach(function(x){
              var card=document.createElement("article"); card.className="os-card";
              var top=document.createElement("div"); top.className="os-top";
              var kind=document.createElement("span"); kind.className="os-kind"; kind.textContent="Standalone OS";
              var state=document.createElement("span"); state.className="os-state"; state.textContent=x.label||x.status||"Tracked";
              top.appendChild(kind); top.appendChild(state); card.appendChild(top);
              var h=document.createElement("h3"); h.textContent=x.name; card.appendChild(h);
              var role=document.createElement("p"); role.className="os-role"; role.textContent=x.role||"Standalone operating system."; card.appendChild(role);
              var meta=document.createElement("div"); meta.className="os-meta";
              var provider=document.createElement("span"); provider.textContent=(x.builder&&x.builder.provider)||"Tracked"; meta.appendChild(provider);
              if(x.repo&&x.repo.name){ var repo=document.createElement("span"); repo.textContent=x.repo.visibility==="private"?"Private repo":"Repo"; meta.appendChild(repo); }
              card.appendChild(meta);
              if(x.embeddedIn&&x.embeddedIn.length){ var emb=document.createElement("div"); emb.className="os-embed"; var eb=document.createElement("b"); eb.textContent="Already embedded in"; emb.appendChild(eb); x.embeddedIn.forEach(function(e){ var sp=document.createElement("span"); sp.textContent=e.name; emb.appendChild(sp); }); card.appendChild(emb); }
              if(x.builder&&x.builder.preview){ var a=document.createElement("a"); a.className="os-link"; a.href=x.builder.preview; a.textContent="Open builder preview ↗"; card.appendChild(a); }
              osGrid.appendChild(card);
            });
            var stamp=document.getElementById("osStamp"); if(stamp) stamp.textContent=visible.length+" public standalone OS builds · internal carriers tracked separately"+(d.generatedAt?" · synced "+new Date(d.generatedAt).toISOString().slice(0,10):"");
            if(surfaceStrip && Array.isArray(d.supportingSurfaces) && d.supportingSurfaces.length){ surfaceStrip.hidden=false; surfaceStrip.innerHTML=""; var b=document.createElement("b"); b.textContent="Supporting surfaces:"; surfaceStrip.appendChild(b); d.supportingSurfaces.forEach(function(x){ var sp=document.createElement("span"); sp.textContent=x.name+" → "+x.parent+" · "+((x.builder&&x.builder.provider)||"tracked")+" · "+x.status; surfaceStrip.appendChild(sp); }); }
          }
          fetch("data/systems.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(renderSystems).catch(function(){});

          /* ---------- rotating founder quotes (data-driven, founder-declared) ---------- */'''
          one(js_anchor,js,'js')

          nav_array='''var secs = ["top","worlds","proof","why","contact"].map(function(id){ return document.getElementById(id); });'''
          nav_array_new='''var secs = ["top","worlds","systems","proof","why","contact"].map(function(id){ return document.getElementById(id); });'''
          one(nav_array,nav_array_new,'nav-array')

          p.write_text(s)
          PY

      - name: Prove expansion is additive and bounded
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id="systems"' site/index.html
          grep -Fq 'fetch("data/systems.json"' site/index.html
          grep -Fq 'Standalone OS layer' site/index.html
          grep -Fq 'Already embedded in' site/index.html
          grep -Fq 'six worlds' scripts/verify-site.mjs
          git diff --check
          git diff -- site/index.html

      - name: Commit OS layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add site/index.html
          git commit -m 'feat(site): show standalone OS layer and embedded relationships'
          git push origin HEAD:main
